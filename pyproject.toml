[project]
name = "gputrace"
version = "1.0.0"
description = "Synthetic GPU-cluster workload trace generation for scheduler/simulator benchmarking"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gputrace = "gputrace.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
