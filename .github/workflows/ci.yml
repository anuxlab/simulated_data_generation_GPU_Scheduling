name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest --cov=gputrace --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  smoke-cli:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: End-to-end smoke test (reference fit -> generate-all -> analyze -> export)
        run: |
          gputrace list-loaders
          gputrace list-scenarios

          # generate-all with no --fit uses the built-in reference fit, so this
          # step needs no external trace file at all (see generators/_reference.py)
          gputrace generate-all --n-jobs 500 --out-dir synthetic_traces
          test -f synthetic_traces/baseline.csv
          test -f synthetic_traces/flash_crowd.csv

          # exercise the analyze path too, via the synthetic loader against a
          # trace this same run just generated (self-contained, no fixture needed)
          gputrace analyze --loader synthetic --input synthetic_traces/baseline.csv --out fit.json
          gputrace generate --scenario bursty_arrivals --fit fit.json --n-jobs 500 --out refit_trace.csv
          test -f refit_trace.csv

          # exercise the k8s_sim exporter
          gputrace export --input synthetic_traces/high_contention.csv --format k8s_sim --out-dir k8s_sim_input
          test -f k8s_sim_input/pods.csv
          test -f k8s_sim_input/nodes.csv
